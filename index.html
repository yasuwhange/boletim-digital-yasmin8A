<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cabeçalho do site -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano — Turma 8A — Nº 30</p>
  </header>

  <!-- Conteúdo principal -->
  <main class="conteudo">
    <!-- Área de acesso por PIN -->
    <section class="acesso-pin" id="acesso-pin">
      <h2>Acessar boletim</h2>
      <p class="info-aluno">8º Ano — Turma 8A — Nº 30</p>
      <label for="campo-pin">PIN</label>
      <input type="password" id="campo-pin" inputmode="numeric" autocomplete="off" placeholder="Digite seu PIN">
      <button id="botao-entrar" type="button">Entrar</button>
      <p id="mensagem-acesso" class="mensagem" role="status"></p>
    </section>

    <!-- Área do boletim (escondida até o login) -->
    <section class="area-boletim" id="area-boletim" hidden>
      <!-- Área dos cards de resumo (o JavaScript vai preencher) -->
      <section class="cards-resumo" id="cards-resumo">
        <!-- Os cards serão inseridos aqui pelo script.js -->
      </section>

      <!-- Área dos gráficos -->
      <section class="area-graficos" aria-label="Gráficos do boletim">
        <article class="grafico-card">
          <h2>Média por disciplina</h2>
          <div class="grafico-container grafico-alto">
            <canvas id="graficoMediasDisciplinas" role="img" aria-label="Gráfico de barras com a média de cada disciplina"></canvas>
          </div>
        </article>

        <article class="grafico-card">
          <h2>Evolução da média geral</h2>
          <div class="grafico-container">
            <canvas id="graficoEvolucaoTrimestres" role="img" aria-label="Gráfico de linha com a evolução da média geral por trimestre"></canvas>
          </div>
        </article>

        <article class="grafico-card" id="card-grafico-faltas">
          <h2>Faltas por trimestre <span id="estadoFaltas" class="badge-perigo" hidden>Perigo</span></h2>
          <div class="grafico-container">
            <canvas id="graficoFaltasTrimestres" role="img" aria-label="Gráfico de barras com as faltas somadas por trimestre"></canvas>
          </div>
        </article>
      </section>

      <!-- Botão para entrar no modo de edição -->
      <div class="acoes-boletim">
        <button id="botao-alterar" type="button">Alterar dados</button>
        <button id="botao-salvar" type="button" hidden>Salvar alterações</button>
        <button id="botao-cancelar" type="button" hidden>Cancelar</button>
        <p id="mensagem-edicao" class="mensagem" role="status"></p>
      </div>

      <!-- Tabela de notas e faltas -->
      <section class="tabela-container">
        <table id="tabela-boletim">
          <thead>
            <tr>
              <th scope="col">Disciplina</th>
              <th scope="col">1º Tri</th>
              <th scope="col">2º Tri</th>
              <th scope="col">3º Tri</th>
              <th scope="col">Média</th>
              <th scope="col">Faltas</th>
              <th scope="col">Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As linhas serão inseridas aqui pelo script.js -->
          </tbody>
        </table>
      </section>
    </section>
  </main>

  <!-- Chart.js (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Arquivo JavaScript que vai montar os dados -->
  <script src="script.js" defer></script>
</body>
</html>
